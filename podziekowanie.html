<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walentynki - Dziękujemy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Dziękuję, kochanie!</h1>
            <p>Walentynki spedzimy w?: <span id="place"></span></p>
            <a href="index.html" class="btn">Wróć na początek</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const place = urlParams.get('place');
        document.getElementById("place").textContent = place;
    </script>
</body>
</html>
